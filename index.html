    <title>有何不可設計｜WHYNOT STUDIO</title>
    <!--
      GitHub Pages 是純靜態伺服器，使用者直接輸入或重新整理
      像 /works/case-01 這種子路徑時，伺服器找不到對應檔案會回 404。
      搭配 404.html 把原始路徑編碼進網址帶回這裡，這段 script
      要在 main.tsx 掛載 App、wouter 開始讀取路由之前先還原路徑。
      參考做法：https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
