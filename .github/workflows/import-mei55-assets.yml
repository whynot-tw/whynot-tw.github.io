name: Import 55 Kitchen assets

on:
  push:
    branches:
      - feature/mei55-content-update-20260730

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: feature/mei55-content-update-20260730

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check gdown Pillow

      - name: Download and optimize Drive assets
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re
          import subprocess

          assets = [
              ('1il2EaX-Vlrbl5RAZiC7dRzQJY9D3NFKC', 'menu-before.webp', 1200, 80),
              ('1o40Q3P7e6u64Ni6m0Lfiz4--l_tKTdyq', 'menu-after.webp', 1200, 80),
              ('1Mfl9ciFlFavyHyKZ9yeguVmvOcCr9nmo', 'product-jar.webp', 900, 78),
              ('1d1odZEFgbWF3K1kP6FAqROHrPsMu3oB_', 'product-refill.webp', 900, 78),
              ('16sglOlJa9SuPrGYE5fHf53xlG-nOQG7T', 'website-desktop.webp', 1000, 72),
              ('10gdwc6xTOGpVl0Si7_L0Bp631bfmMj3j', 'order-form-mobile.webp', 720, 72),
              ('1Jx6gASW8NzXaVc6WscS0AQ_8SmMrc3Op', 'line-menu.webp', 1200, 78),
              ('1bOSXvB3WRQctveT_9fdkDHgCM5SMpo_T', 'order-flow.webp', 900, 78),
              ('1nZRsAp1hBRbQ36g1IpaBxW1D3XfAA9JC', 'serving-scene.webp', 900, 78),
              ('1PUmCKNr3a7uEwgZl0Bvhq-8zT0Cfsxn_', 'customer-feedback.webp', 900, 78),
          ]

          output_dir = Path('assets/images/mei55')
          output_dir.mkdir(parents=True, exist_ok=True)
          temp_dir = Path('/tmp/mei55-drive')
          temp_dir.mkdir(parents=True, exist_ok=True)

          for file_id, filename, max_width, quality in assets:
              source = temp_dir / f'{file_id}.source'
              url = f'https://drive.google.com/uc?id={file_id}'
              subprocess.run(['gdown', url, '-O', str(source)], check=True)

              with Image.open(source) as opened:
                  image = ImageOps.exif_transpose(opened)
                  if image.mode in ('RGBA', 'LA'):
                      canvas = Image.new('RGB', image.size, 'white')
                      canvas.paste(image, mask=image.getchannel('A'))
                      image = canvas
                  else:
                      image = image.convert('RGB')

                  if image.width > max_width:
                      new_height = round(image.height * max_width / image.width)
                      image = image.resize((max_width, new_height), Image.Resampling.LANCZOS)

                  image.save(output_dir / filename, 'WEBP', quality=quality, method=6)

          html_path = Path('works/mei55/index.html')
          html = html_path.read_text(encoding='utf-8')

          for file_id, filename, _, _ in assets:
              local_path = f'../../assets/images/mei55/{filename}'
              html = re.sub(
                  rf'https://drive\.google\.com/file/d/{re.escape(file_id)}/view',
                  local_path,
                  html,
              )
              html = re.sub(
                  rf'https://drive\.google\.com/thumbnail\?id={re.escape(file_id)}&sz=w\d+',
                  local_path,
                  html,
              )

          html = html.replace(
              'case-media-card case-media-card--wide"><a href="../../assets/images/mei55/website-desktop.webp"',
              'case-media-card case-media-card--wide case-media-card--screen"><a href="../../assets/images/mei55/website-desktop.webp"',
          )
          html = html.replace(
              'case-media-card"><a href="../../assets/images/mei55/order-form-mobile.webp"',
              'case-media-card case-media-card--screen"><a href="../../assets/images/mei55/order-form-mobile.webp"',
          )
          html_path.write_text(html, encoding='utf-8')

          css_path = Path('assets/css/portfolio.css')
          css = css_path.read_text(encoding='utf-8')
          rules = '''\n.case-media-card > a { display: block; overflow: hidden; border-radius: 4px; background: var(--surface); }\n.case-media-card img { width: 100%; height: auto; }\n.case-media-card--screen img { height: min(720px,72vh); object-fit: cover; object-position: top; }\n'''
          if '.case-media-card--screen img' not in css:
              css = css.replace(
                  '.case-media-card figcaption {',
                  rules + '.case-media-card figcaption {',
              )
              css_path.write_text(css, encoding='utf-8')
          PY

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/mei55 works/mei55/index.html assets/css/portfolio.css
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "assets: 將 55 廚房素材正式存入作品集"
          git push origin HEAD:feature/mei55-content-update-20260730
