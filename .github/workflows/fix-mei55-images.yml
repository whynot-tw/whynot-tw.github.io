name: Fix Mei55 Images

on:
  push:
    branches:
      - fix/mei55-broken-images-20260730
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mei55-broken-images-20260730

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Download sources and rebuild valid WebP files
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import requests

          sources = {
              'menu_old': '1il2EaX-Vlrbl5RAZiC7dRzQJY9D3NFKC',
              'menu_new': '1o40Q3P7e6u64Ni6m0Lfiz4--l_tKTdyq',
              'bottle': '1Mfl9ciFlFavyHyKZ9yeguVmvOcCr9nmo',
              'vacuum': '1d1odZEFgbWF3K1kP6FAqROHrPsMu3oB_',
              'website': '16sglOlJa9SuPrGYE5fHf53xlG-nOQG7T',
              'form': '10gdwc6xTOGpVl0Si7_L0Bp631bfmMj3j',
              'line_menu': '1Jx6gASW8NzXaVc6WscS0AQ_8SmMrc3Op',
              'order_flow': '1bOSXvB3WRQctveT_9fdkDHgCM5SMpo_T',
              'food': '1nZRsAp1hBRbQ36g1IpaBxW1D3XfAA9JC',
              'feedback': '1PUmCKNr3a7uEwgZl0Bvhq-8zT0Cfsxn_',
          }

          work = Path('/tmp/mei55-src')
          out = Path('assets/images/mei55')
          work.mkdir(parents=True, exist_ok=True)
          out.mkdir(parents=True, exist_ok=True)

          def download(name, file_id):
              urls = [
                  f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t',
                  f'https://drive.google.com/uc?export=download&id={file_id}',
                  f'https://drive.google.com/thumbnail?id={file_id}&sz=w4000',
              ]
              for index, url in enumerate(urls):
                  response = requests.get(url, timeout=90, allow_redirects=True)
                  data = response.content
                  ctype = response.headers.get('content-type', '')
                  if response.ok and len(data) > 10000 and ('image' in ctype or data[:8] in (b'\x89PNG\r\n\x1a\n',) or data[:3] == b'\xff\xd8\xff'):
                      path = work / f'{name}-{index}'
                      path.write_bytes(data)
                      return path
              raise RuntimeError(f'Could not download source: {name}')

          files = {name: download(name, fid) for name, fid in sources.items()}

          def rgb(name):
              im = Image.open(files[name])
              if im.mode in ('RGBA', 'LA'):
                  bg = Image.new('RGB', im.size, 'white')
                  bg.paste(im, mask=im.getchannel('A'))
                  return bg
              return im.convert('RGB')

          def fit(im, box, bg=(255,255,255), padding=24):
              w, h = box
              canvas = Image.new('RGB', (w, h), bg)
              inner = (w - 2 * padding, h - 2 * padding)
              resized = ImageOps.contain(im, inner, Image.Resampling.LANCZOS)
              canvas.paste(resized, ((w-resized.width)//2, (h-resized.height)//2))
              return canvas

          def pair(names, size, margin, gap, filename):
              W, H = size
              canvas = Image.new('RGB', size, (245,245,245))
              cell_w = (W - 2*margin - gap)//2
              for i, name in enumerate(names):
                  cell = fit(rgb(name), (cell_w, H-2*margin), padding=18)
                  canvas.paste(cell, (margin + i*(cell_w+gap), margin))
              canvas.save(out/filename, 'WEBP', quality=88, method=6)

          pair(('menu_old','menu_new'), (2040,1400), 40, 40, 'menu-comparison.webp')
          pair(('bottle','vacuum'), (1836,900), 36, 36, 'product-packaging.webp')
          pair(('line_menu','order_flow'), (2040,800), 32, 32, 'line-order-flow.webp')
          pair(('food','feedback'), (1836,900), 36, 36, 'experience-proof.webp')

          def tall(name, width, height, filename):
              im = rgb(name)
              resized = im.resize((width, round(im.height*width/im.width)), Image.Resampling.LANCZOS)
              crop = resized.crop((0,0,width,min(height,resized.height)))
              if crop.height < height:
                  canvas = Image.new('RGB', (width,height), 'white')
                  canvas.paste(crop, (0,0))
                  crop = canvas
              crop.save(out/filename, 'WEBP', quality=82, method=6)

          tall('website', 900, 3036, 'website-preview.webp')
          tall('form', 620, 3036, 'order-form-preview.webp')

          expected = [
              'menu-comparison.webp', 'product-packaging.webp',
              'website-preview.webp', 'order-form-preview.webp',
              'line-order-flow.webp', 'experience-proof.webp'
          ]
          for name in expected:
              path = out/name
              data = path.read_bytes()
              if len(data) < 50000 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise RuntimeError(f'Invalid WebP output: {name}')
              Image.open(path).verify()
              print(name, len(data))
          PY

      - name: Commit rebuilt binary images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/mei55/*.webp
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "修復 55 廚房 WebP 圖片檔"
            git push origin HEAD:fix/mei55-broken-images-20260730
          fi
